<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>COMP5583 Personal Website</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: #f5f5f5;
            color: #222;
        }

        .container {
            width: 90%;
            max-width: 700px;
            text-align: center;
            background: white;
            padding: 48px 32px;
            border-radius: 12px;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.08);
        }

        h1 {
            margin-bottom: 12px;
        }

        p {
            color: #666;
            margin-bottom: 32px;
        }

        .version-list {
            display: flex;
            gap: 16px;
            justify-content: center;
            flex-wrap: wrap;
        }

        .version-link {
            display: inline-block;
            padding: 14px 24px;
            text-decoration: none;
            color: white;
            background: #222;
            border-radius: 8px;
            transition: 0.2s;
        }

        .version-link:hover {
            background: #555;
            transform: translateY(-2px);
        }
    </style>
</head>

<body>

    <main class="container">

        <h1>COMP5583 Personal Website</h1>

        <p>
            Personal Website Development with AI Agents
        </p>

        <div class="version-list">

            <a class="version-link" href="./v0/">
                V0
            </a>

            <a class="version-link" href="./v1/">
                V1
            </a>

            <a class="version-link" href="./v2/">
                V2
            </a>

        </div>

    </main>

</body>
</html>
